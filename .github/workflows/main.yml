name: Build/release

on: push

jobs:
    release:
        runs-on: ${{ matrix.os }}

        # Platforms to build on/for
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-2022]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install Node.js, NPM and Yarn
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Additional step from MaCOS
              if: startsWith(matrix.os, 'macos')
              run: sudo -H pip install setuptools

            - name: Additional step for ubuntu
              if: startsWith(matrix.os, 'ubuntu')
              run: |
                sudo apt update
                sudo apt-get install libudev-dev

            #- name: Install Snapcraft
            #  uses: samuelmeuli/action-snapcraft@v1
            #  # Only install Snapcraft on Ubuntu
            #  if: startsWith(matrix.os, 'ubuntu')
            #  with:
            #    # Log in to Snap Store
            #    snapcraft_token: ${{ secrets.snapcraft_token }}
            #- name: Prepare for app notarization (macOS)
            #  if: startsWith(matrix.os, 'macos')
            #  # Import Apple API key for app notarization on macOS
            #  run: |
            #    mkdir -p ~/private_keys/
            #    echo '${{ secrets.api_key }}' > ~/private_keys/AuthKey_${{ secrets.api_key_id }}.p8
            - name: Build/release Electron app
              uses: coparse-inc/action-electron-builder@v1.0.0
              with:
                  # GitHub token, automatically provided to the action
                  # (No need to define this secret in the repo settings)
                  github_token: ${{ secrets.github_token }}

                  ## macOS code signing certificate
                  #mac_certs: ${{ secrets.mac_certs }}
                  #mac_certs_password: ${{ secrets.mac_certs_password }}

                  ## If the commit is tagged with a version (e.g. "v1.0.0"),
                  ## release the app after building
                  #release: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  release: 1
              #env:
              ## macOS notarization API key
              #API_KEY_ID: ${{ secrets.api_key_id }}
              #API_KEY_ISSUER_ID: ${{ secrets.api_key_issuer_id }}
            # - name: Archive production artifacts
            #   uses: actions/upload-artifact@v2
            #   with:
            #       name: "dist_$RUNNER_OS"
            #       path: dist

    # Raspberry Pi (64-bit Raspberry Pi OS) and other Linux ARM64 systems: .deb and .AppImage
    release-linux-arm64:
        runs-on: ubuntu-24.04-arm

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Install build dependencies
              # there is no prebuilt pngquant-bin binary for Linux ARM64,
              # npm install compiles it from source
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libudev-dev libimagequant-dev libpng-dev pkg-config

            - name: Install npm packages
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build/release Electron app
              run: npx electron-builder --linux deb AppImage --publish always
              env:
                  GH_TOKEN: ${{ secrets.github_token }}
